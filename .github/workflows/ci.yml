name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Dummy env values สำหรับ build/test ใน CI — ไม่ใช่ secret จริง
# ป้องกัน src/lib/{stripe,prisma,redis}.ts throw ตอน import (require env ที่ module-load)
env:
  STRIPE_SECRET_KEY: sk_test_dummy_ci
  DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci_dummy_secret_at_least_32_characters_long_xx
  NEXT_PUBLIC_ROOT_DOMAIN: gethelpwise.xyz

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
        env:
          NODE_ENV: test

      - name: Build
        run: npm run build

      # กัน server-only secret หลุดเข้า client bundle — ตรวจ artifact จริง ไม่ใช่ source
      # (tsc/eslint บังคับกฎ "client ห้าม import ไฟล์ไหน" ไม่ได้ ดู scripts/scan-client-bundle.ts)
      - name: Scan client bundle for server-only secrets
        run: npm run scan:bundle

      - name: Audit dependencies (report only)
        run: npm audit --audit-level=high || true
