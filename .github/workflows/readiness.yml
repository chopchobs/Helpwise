# .github/workflows/readiness.yml
# Phase 39 ลำดับ 5 (erratum §E) — ผู้เฝ้า readiness probe (P2)
#
# ═══════════════════════════════════════════════════════════════════════════
# README — ต้องตั้งอะไรที่ไหนบ้าง (ยังไม่ตั้ง = workflow ล้มทันทีพร้อมชื่อ env ที่ขาด)
#
# 1) GitHub → Settings → Secrets and variables → Actions → New repository secret
#    ┌──────────────────────────┬────────────────────────────────────────────┐
#    │ PROD_BASE_URL            │ origin ของ **โดเมน production** เท่านั้น    │
#    │                          │ เช่น https://gethelpwise.xyz               │
#    │                          │ ⛔ ห้ามใส่ *.vercel.app — script ปฏิเสธเอง │
#    ├──────────────────────────┼────────────────────────────────────────────┤
#    │ READINESS_PROBE_TOKEN    │ ต้องตรงกับ env ชื่อเดียวกันบน Vercel        │
#    │                          │ (Production scope) — ไม่ตรง = 401 ทุกรอบ   │
#    ├──────────────────────────┼────────────────────────────────────────────┤
#    │ SLACK_WEBHOOK_URL        │ Webhook ของช่องที่จะรับแจ้งเตือน            │
#    │                          │ ⚠️ ของจริง = **Discord** (เติม /slack ท้าย  │
#    │                          │ URL ⇒ Slack-compatible) ไม่ใช่ Slack        │
#    └──────────────────────────┴────────────────────────────────────────────┘
#
# 2) Vercel → Project Settings → Environment Variables (Production)
#    READINESS_PROBE_TOKEN = ค่าเดียวกับข้อ 1
#    ⚠️ ต้อง **redeploy** หลังตั้ง — ไม่งั้น runtime ยังไม่เห็นค่า
#
# 3) trigger `deployment_status` มาจาก Vercel GitHub integration ที่ต่อไว้อยู่แล้ว
#    ไม่ต้องตั้งอะไรเพิ่ม
#
# ═══════════════════════════════════════════════════════════════════════════
# §H-12 ทาง A (ตัดสิน 2026-08-09 · ลงมือ 2026-08-10) — **ทำไมมีสอง job**
#
# `actions/cache` ปฏิเสธ event ที่ไม่ผูกกับ branch/tag ref ⇒ บน `deployment_status`
# ทั้ง restore และ save **no-op เงียบ (สเต็ปยังเขียว 0s)** ⇒ ผู้เฝ้าไม่มีความจำข้ามทริกเกอร์
# ⇒ deploy พังแล้วหายเองก่อน cron รอบถัดไป = **ไม่มีข้อความ recovery** (§G ข้อ 15 · วัดจาก prod แล้ว)
#
#   ต้นเหตุฝั่งเรา = เอาตัวตรวจที่ **มี state** ไปรันบน event ที่ **ไม่มี ref**
#   ⇒ job `dispatch` (deployment_status) ไม่ตรวจอะไรเลย แค่สั่ง `workflow_dispatch`
#     ให้ job `check` ไปรันบน event ที่ผูก ref ⇒ cache ใช้ได้ตามปกติ
#
# ⚠️ **ผลข้างเคียงที่ต้องรู้ล่วงหน้า (§H-12 ความเสี่ยงข้อ 3):** run ที่ถูก dispatch
#    checkout ที่ **HEAD ของ default branch** ไม่ใช่ sha ของ deployment
#    ⇒ ถ้า `main` ขยับระหว่างนั้น **โค้ดของผู้ตรวจจะใหม่กว่าโค้ดที่ถูกตรวจ**
#    ⇒ ✅ **ไม่ใช่บั๊ก** — ความถูกต้องอยู่ที่ `expected_sha` ที่ส่งผ่าน input (ยังเทียบกับ sha ที่ deploy จริง)
#      และตรงกับหลักการของเฟสนี้: *ผู้เฝ้าไม่ใช่ผู้ถูกเฝ้า* (§H-5)
#
# ⚠️ **60-day auto-disable**: GitHub ปิด scheduled workflow อัตโนมัติเมื่อ repo เงียบ 60 วัน
#    ⇒ ตัวเฝ้าหายไปเงียบ ๆ ได้เอง · in-band gap check ในสคริปต์จับได้เฉพาะตอน "กลับมารัน"
#    ⇒ ชั้นที่ครอบเคส "ไม่รันเลย" คือ external pinger (ลำดับ 6) ซึ่งอยู่นอก GitHub ทั้งหมด
#    สองชั้นนี้เสริมกัน **ไม่ทดแทนกัน**
# ═══════════════════════════════════════════════════════════════════════════

name: Readiness (P2)

on:
  # Vercel ยิง deployment_status เข้ามาเมื่อ deploy เปลี่ยนสถานะ
  # ⇒ job `dispatch` เท่านั้นที่รับ event นี้ (ดูหัวไฟล์ §H-12)
  deployment_status:
  # ทุก 15 นาที — ต้องตรงกับ CRON_INTERVAL_MINUTES ใน scripts/readiness-check.ts
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "โหมดของ readiness-check (กดมือเปล่า ๆ = scheduled = พฤติกรรมเดิมทุกประการ)"
        required: false
        type: choice
        default: scheduled
        options: [scheduled, post-deploy]
      expected_sha:
        description: "commit sha (hex 40 ตัว) ที่เพิ่ง deploy — **บังคับเมื่อ mode=post-deploy**"
        required: false
        type: string

# ⚠️ concurrency ย้ายจากระดับ workflow มาอยู่ **ระดับ job** โดยตั้งใจ (§H-12 ความเสี่ยงข้อ 1 ชั้น ข)
#    ถ้ายังอยู่ระดับ workflow ⇒ run ของ `dispatch` กับ run ที่มันสั่ง **แย่ง slot เดียวกัน**
#    ⛔ ห้ามย้ายกลับขึ้นมาระดับ workflow

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # job 1/2 — post-deploy: **ไม่ตรวจอะไรเลย** แค่ส่งต่อไปยัง event ที่มี ref
  # ────────────────────────────────────────────────────────────────────────
  dispatch:
    # เฉพาะ production ที่ deploy สำเร็จ
    # (deployment_status ยิงทุกสถานะ รวม pending/error — และยิงจาก preview ด้วย)
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # ชั้น ข ของกฎกัน deadlock — **กลุ่มแยกจาก `readiness`**
    # ต่อให้ชั้น ก (ห้ามรอผล) พลาด สอง run ก็ไม่แย่ง slot เดียวกัน ⇒ ไม่มีคิวให้ติด
    # ⛔ ห้ามเปลี่ยนให้ตรงกับกลุ่มของ job `check`
    concurrency:
      group: readiness-dispatch
      cancel-in-progress: false

    permissions:
      contents: read
      # ต้องมีเพื่อสั่ง workflow_dispatch — `GITHUB_TOKEN` พอ **ไม่มีความลับใหม่**
      actions: write

    steps:
      - name: Dispatch post-deploy check
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.deployment_status.deployment.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # validate ก่อนส่ง — sha มั่วจะทำให้ปลายทาง poll จนหมดเวลา 5 นาทีโดยเปล่าประโยชน์
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::EXPECTED_SHA ไม่ใช่ hex 40 ตัว: '$EXPECTED_SHA'"
            exit 1
          fi
          # เวลาอ้างอิงสำหรับสเต็ปถัดไป (ลบ 60s กันนาฬิกาเหลื่อม)
          echo "DISPATCH_SINCE=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          # ⛔ ชั้น ก: **ห้ามรอผล** — ห้าม --watch · `gh workflow run` ไม่รอผลโดยค่าเริ่มต้น
          gh workflow run readiness.yml \
            --ref "$DEFAULT_BRANCH" \
            -f mode=post-deploy \
            -f expected_sha="$EXPECTED_SHA"

      # §H-12 ความเสี่ยงข้อ 4 — `gh workflow run` exit 0 ได้ทั้งที่ run ปลายทางไม่เคยเริ่ม
      # ⇒ ยืนยันว่า **มี run ถูกสร้าง** (ไม่ใช่ว่า run ทำงานเสร็จ)
      # 🔑 เส้นแบ่ง: ยืนยันว่า run *ถูกสร้าง* ≠ รอว่า run *ทำงานเสร็จ*
      #    อย่างหลังคือการรอที่ชั้น ก ห้าม ⇒ จะสร้าง deadlock ด้วยมือ
      - name: Verify a run was actually created   # ⇐ effect ไม่ใช่เจตนา
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ⛔ poll **มีเพดาน** 3 ครั้ง (~20 วินาที) — ห้ามวนจนกว่า run จะจบ
          for i in 1 2 3; do
            n=$(gh run list \
                  --workflow readiness.yml \
                  --event workflow_dispatch \
                  --created ">=$DISPATCH_SINCE" \
                  --limit 20 --json databaseId --jq 'length')
            [ "$n" -ge 1 ] && exit 0
            sleep 10
          done
          echo "::error::สั่ง dispatch แล้วแต่ไม่พบ run ที่ถูกสร้างหลัง $DISPATCH_SINCE — post-deploy check ไม่ได้รัน"
          exit 1

  # ────────────────────────────────────────────────────────────────────────
  # job 2/2 — งานตรวจทั้งหมด + restore/save state (รันบน event ที่ผูก ref เท่านั้น)
  # ────────────────────────────────────────────────────────────────────────
  check:
    # ⛔ ไม่รับ deployment_status อีกต่อไป — cache no-op เงียบบน event นั้น (§G ข้อ 15)
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # กันสองรอบทับกัน (cron ชนกับ post-deploy) — state ข้ามรอบจะเพี้ยนถ้ารันพร้อมกัน
    # เจตนาเดิมยังได้ครบ เพราะ **ตัวที่เขียน state คือ job นี้ job เดียว**
    concurrency:
      group: readiness
      cancel-in-progress: false

    permissions:
      contents: read
      # อ่าน /actions/caches เพื่อพิสูจน์ว่าสเต็ป save เขียนจริง
      actions: read

    env:
      # schedule ไม่มี inputs ⇒ ตกมาที่ scheduled = พฤติกรรมเดิม
      MODE: ${{ inputs.mode || 'scheduled' }}

    steps:
      # ⚠️ input เข้าทาง env เท่านั้น — ห้าม interpolate `${{ inputs.* }}` ลงใน `run:` ตรง ๆ (script injection)
      - name: ตรวจ input ก่อนใช้
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "post-deploy" ]; then
            if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::mode=post-deploy ต้องมี expected_sha เป็น hex 40 ตัว (ได้: '$EXPECTED_SHA')"
              exit 1
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # state ข้ามรอบ (verdict ก่อนหน้า + เวลารันรอบก่อน)
      # key ไม่ซ้ำทุกรอบ + restore-keys prefix ⇒ ได้ cache ล่าสุดเสมอ
      # (cache ของ GitHub เขียนทับ key เดิมไม่ได้ จึงต้องใช้รูปแบบนี้)
      - name: Restore readiness state
        uses: actions/cache/restore@v4
        with:
          path: .readiness-state
          key: readiness-state-${{ github.run_id }}
          restore-keys: |
            readiness-state-

      # 🔑 เป้าหมายที่ยิงยังมาจาก `secrets.PROD_BASE_URL` เท่านั้น **ไม่ใช่จาก input**
      #    input ใหม่มีแค่ mode/expected_sha ⇒ เปลี่ยนไม่ได้ว่าจะยิงไปที่ไหน (§H-6 ชั้น 2 ไม่ถูกกระทบ)
      - name: Post-deploy identity poll + probe
        if: env.MODE == 'post-deploy'
        env:
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          READINESS_PROBE_TOKEN: ${{ secrets.READINESS_PROBE_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # sha ของ deployment ที่เพิ่งขึ้น (validate เป็น hex 40 แล้วในสเต็ปแรก)
          # — ใช้ยืนยันว่า alias สลับมาแล้วจริง
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: npx tsx scripts/readiness-check.ts post-deploy

      - name: Scheduled probe + in-band gap check
        if: env.MODE != 'post-deploy'
        env:
          PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
          READINESS_PROBE_TOKEN: ${{ secrets.READINESS_PROBE_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: npx tsx scripts/readiness-check.ts scheduled

      # ⚠️ ต้องเซฟแม้ step ก่อนหน้าจะแดง — ไม่งั้นรอบที่ FAIL จะไม่ถูกจำ
      #    แล้วรอบถัดไปจะมองว่าเป็น transition ใหม่ ⇒ แจ้งซ้ำทุก 15 นาที = alert fatigue
      #    ซึ่งเป็นความเสียหายที่ transition-only ถูกออกแบบมาเพื่อกันพอดี
      - name: Save readiness state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .readiness-state
          key: readiness-state-${{ github.run_id }}

      # §H-12 ส่วนที่ 2 (§G ข้อ 16) — **"สเต็ปเขียว ≠ สเต็ปทำงาน"**
      # `Save readiness state` เคยขึ้นเขียว 0s ทั้งที่ไม่ได้เขียนอะไรเลย ⇒ สถานะเขียวไม่นับเป็นหลักฐาน
      #
      # 🔑 ตรวจผ่าน **REST API** ไม่ใช่ `actions/cache/restore` + `fail-on-cache-miss`:
      #    **ผู้ตรวจต้องไม่เป็นชิ้นส่วนเดียวกับผู้ถูกตรวจ** — ถ้า verify ด้วย action ตัวเดียวกับที่เพิ่ง
      #    no-op เงียบ ความผิดพลาดชนิดเดียวจะทำให้ทั้งสองฝ่าย "เห็นตรงกันว่าไม่มีปัญหา" (หลักการเดียวกับ §H-5)
      # ⛔ ห้ามเปลี่ยนไปใช้ `actions/cache/restore` · ⛔ ห้าม grep log หา `Event Validation Error`
      #    (ผูกกับถ้อยคำของ third-party ที่เปลี่ยนได้ทุกเมื่อ = คลาสเดียวกับที่กำลังปิด)
      - name: Verify state was actually saved   # ⇐ effect ไม่ใช่เจตนา
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key="readiness-state-${{ github.run_id }}"
          # cache entry อาจโผล่ใน API ช้ากว่าสเต็ป save เล็กน้อย ⇒ ลองซ้ำ **แบบมีเพดาน**
          for i in 1 2 3; do
            n=$(gh api "/repos/${{ github.repository }}/actions/caches?key=$key" --jq '.total_count')
            [ "$n" -ge 1 ] && exit 0
            sleep 5
          done
          echo "::error::cache entry '$key' ไม่มีอยู่จริงหลังสเต็ป save — ความจำของผู้เฝ้าไม่ถูกบันทึก"
          exit 1
